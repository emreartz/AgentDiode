name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create source archive
        run: |
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="AgentDiode-${GITHUB_REF_NAME}/" \
            --output="dist/AgentDiode-${GITHUB_REF_NAME}.tar.gz" \
            HEAD
          cd dist
          sha256sum "AgentDiode-${GITHUB_REF_NAME}.tar.gz" \
            > "AgentDiode-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --generate-notes \
            --verify-tag
