name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,tray]'
      - name: Tests
        run: pytest
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh scripts/run-tests.sh

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vscode-agentdiode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode-agentdiode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run compile
